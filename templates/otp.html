<!DOCTYPE html>
<html>
<head>
<title>OTP Verification</title>

<style>

body{
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#1e293b;
padding:40px;
border-radius:10px;
width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:15px;
border:none;
border-radius:6px;
}

button{
margin-top:15px;
width:100%;
padding:10px;
background:#ff9900;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

</style>
<link rel="stylesheet" href="/static/page-transition.css">
</head>

<body>

<div class="box">

<h2>Verify OTP 📩</h2>

<form action="/verify_register_otp" method="POST">

<input type="text" name="otp" placeholder="Enter OTP" required>

<button type="submit">Verify OTP</button>

</form>

</div>

<script src="/static/page-transition.js"></script>
</body>
</html>
