<!DOCTYPE html>
<html>
<head>
<title>Verify OTP</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg,#1e1e2f,#2c3e50);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#111;
    padding:30px;
    border-radius:12px;
    width:350px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    text-align:center;
    letter-spacing:3px;
    font-size:18px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#00cc66;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00e673;
}

.msg{
    margin-bottom:10px;
    color:#ff4d4d;
}
</style>
<link rel="stylesheet" href="/static/page-transition.css">
</head>

<body>

<div class="box">

<h2>Enter OTP 🔐</h2>

{% if session.get('notification') %}
<div class="msg">{{ session.pop('notification') }}</div>
{% endif %}

<form method="POST">
    <input type="text" name="otp" placeholder="Enter OTP" required>
    <button type="submit">Verify OTP</button>
</form>

</div>

<script src="/static/page-transition.js"></script>
</body>
</html>
